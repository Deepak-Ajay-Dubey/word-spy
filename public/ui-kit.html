<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Spy - Mobile UI Kit</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: #0d131b;
      color: #EDE6D6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .title-group h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .title-group p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: rgba(237, 230, 214, 0.6);
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button, a.btn {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #2C3848;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #B08D57;
      color: #1B2430;
      border-color: #B08D57;
    }
    .btn-primary:hover {
      background: #C29D64;
    }
    .btn-secondary {
      background: #161E28;
      color: #EDE6D6;
    }
    .btn-secondary:hover {
      background: #243040;
    }
    .canvas-container {
      width: 100%;
      max-width: 1200px;
      background: #141B24;
      border: 1px solid #2C3848;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .canvas-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="title-group">
      <h1>Word Spy - Mobile UI Kit Board</h1>
      <p>High-resolution design system for single-device mobile gameplay</p>
    </div>
    <div class="btn-group">
      <button class="btn-primary" onclick="exportImage('png')">
        ⬇ Export High-Res PNG
      </button>
      <button class="btn-secondary" onclick="exportImage('jpeg')">
        ⬇ Export JPG
      </button>
      <a class="btn btn-secondary" href="/word_spy_ui_kit.svg" download="word_spy_ui_kit.svg">
        ⬇ Download Vector SVG
      </a>
    </div>
  </div>

  <div class="canvas-container">
    <img id="ui-kit-img" src="/word_spy_ui_kit.svg" alt="Word Spy Mobile UI Kit">
  </div>

  <canvas id="export-canvas" width="1600" height="1000"></canvas>

  <script>
    function exportImage(format) {
      const img = document.getElementById('ui-kit-img');
      const canvas = document.getElementById('export-canvas');
      const ctx = canvas.getContext('2d');

      const imageObj = new Image();
      imageObj.crossOrigin = 'anonymous';
      imageObj.onload = function() {
        // Fill dark background for JPG
        ctx.fillStyle = '#141B24';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(imageObj, 0, 0, canvas.width, canvas.height);

        const mime = format === 'jpeg' ? 'image/jpeg' : 'image/png';
        const quality = format === 'jpeg' ? 0.95 : 1.0;
        const dataUrl = canvas.toDataURL(mime, quality);

        const downloadLink = document.createElement('a');
        downloadLink.download = `word_spy_ui_kit.${format === 'jpeg' ? 'jpg' : 'png'}`;
        downloadLink.href = dataUrl;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      };
      imageObj.src = '/word_spy_ui_kit.svg';
    }
  </script>
</body>
</html>
